<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Palm Cove — a low-poly open-world crime game</title>
<style>
  * {
    box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #0c071c;
    color: #fff7ea; font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #app { position: fixed; inset: 0; overflow: hidden; background: #0c071c; }
  #app canvas { display: block; }
  #app > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .screen {
    position: absolute; inset: 0; z-index: 40; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 24px 20px;
    background: rgba(12, 7, 28, 0.84); text-align: center;
  }
  .screen h1 { letter-spacing: 0.18em; font-size: 30px; color: #fff7ea; }
  .screen h2 { letter-spacing: 0.14em; font-size: 22px; color: #fff7ea; }
  .screen p { max-width: 520px; line-height: 1.45; color: #e8ddf5; font-size: 15px; }
  .menu-title {
    font-size: clamp(52px, 13vw, 108px); font-weight: 900; line-height: 0.95;
    letter-spacing: 0.12em; color: transparent;
    background: linear-gradient(180deg, #ffe66d 0%, #ffb52e 34%, #ff5f9e 72%, #b04dff 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 0 rgba(23, 16, 46, 0.85));
  }
  .menu-subtitle {
    font-size: 16px; letter-spacing: 0.06em; color: #ffd9ec;
    max-width: 540px; line-height: 1.5;
  }
  .menu-footer {
    margin-top: 10px; font-size: 12px; letter-spacing: 0.08em;
    color: rgba(255, 247, 234, 0.62);
  }
  .btn {
    pointer-events: auto; appearance: none; border: none; cursor: pointer;
    padding: 14px 28px; min-width: 230px; border-radius: 12px;
    background: #ffb52e; color: #241203; font-family: inherit;
    font-size: 17px; font-weight: 800; letter-spacing: 0.1em;
    box-shadow: 0 4px 0 #a96f00, 0 8px 18px rgba(0, 0, 0, 0.45);
  }
  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #a96f00, 0 4px 10px rgba(0, 0, 0, 0.45);
  }
  .btn-ghost {
    background: transparent; color: #fff7ea; box-shadow: none;
    border: 2px solid rgba(255, 247, 234, 0.55);
  }
  .btn:disabled { opacity: 0.38; cursor: default; transform: none; }
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
  .hud-topleft {
    position: absolute; top: 14px; left: 14px; min-width: 168px;
    display: flex; flex-direction: column; gap: 7px;
  }
  #moneyEl {
    font-size: 22px; font-weight: 900; letter-spacing: 0.04em; color: #ffe66d;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 0, 0, 0.6);
  }
  .health-shell {
    width: 168px; height: 14px; border-radius: 8px; overflow: hidden;
    background: rgba(12, 7, 28, 0.78); border: 1px solid rgba(255, 247, 234, 0.45);
  }
  #healthFill {
    height: 100%; width: 100%; border-radius: 8px; transition: width 0.18s ease;
    background: linear-gradient(90deg, #37d67a 0%, #9be15d 55%, #ffb52e 100%);
  }
  #starsEl {
    position: absolute; top: 12px; right: 176px; font-size: 24px;
    letter-spacing: 0.18em; color: #ffd23e; text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
  }
  #starsEl.blink { opacity: 0.25; }
  #objectiveEl {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    max-width: 46vw; padding: 7px 16px; border-radius: 999px; text-align: center;
    background: rgba(23, 16, 46, 0.78); border: 1px solid rgba(255, 181, 46, 0.5);
    font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #bannerEl {
    position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%);
    font-size: clamp(30px, 7vw, 58px); font-weight: 900; text-align: center;
    letter-spacing: 0.12em; color: #fff7ea; pointer-events: none;
    text-shadow: 0 3px 0 #ff5f9e, 0 6px 18px rgba(0, 0, 0, 0.9);
  }
  #dialogEl {
    position: absolute; left: 50%; bottom: 168px; transform: translateX(-50%);
    width: min(620px, 92vw); padding: 14px 18px; border-radius: 14px;
    background: #17102e; border: 2px solid rgba(255, 95, 158, 0.65);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6); pointer-events: auto;
  }
  #dialogName { color: #ff5f9e; font-weight: 900; letter-spacing: 0.1em; font-size: 14px; margin-bottom: 6px; }
  #dialogText { font-size: 16px; line-height: 1.45; color: #fff7ea; }
  #choiceRow { display: flex; gap: 10px; margin-top: 12px; }
  #choiceRow .btn { flex: 1; min-width: 0; padding: 10px 12px; font-size: 14px; }
  #promptEl {
    position: absolute; left: 50%; bottom: 148px; transform: translateX(-50%);
    padding: 8px 18px; border-radius: 999px; white-space: nowrap;
    background: rgba(23, 16, 46, 0.85); border: 1px solid rgba(255, 247, 234, 0.4);
    font-size: 14px; font-weight: 700; letter-spacing: 0.04em;
  }
  .minimap-wrap {
    position: absolute; top: 12px; right: 12px;
    display: flex; flex-direction: column; gap: 7px; align-items: stretch;
  }
  #minimap {
    width: 148px; height: 148px; border-radius: 12px; background: #10233f;
    border: 2px solid rgba(255, 247, 234, 0.65); pointer-events: auto;
  }
  .minimap-btns { display: flex; flex-direction: column; gap: 6px; }
  .minimap-btns .btn { pointer-events: auto; min-width: 0; padding: 7px 10px; font-size: 12px; border-radius: 9px; }
  #radioEl {
    position: absolute; left: 14px; bottom: 148px; padding: 6px 12px;
    border-radius: 999px; background: rgba(23, 16, 46, 0.82);
    border: 1px solid rgba(255, 95, 158, 0.55); color: #ffd9ec;
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
  }
  #prisonEl {
    position: absolute; top: 54px; left: 50%; transform: translateX(-50%);
    padding: 7px 16px; border-radius: 999px; color: #ffe3e6;
    background: rgba(120, 12, 32, 0.85); border: 1px solid #ff5f6e;
    font-size: 13px; font-weight: 800; letter-spacing: 0.06em;
  }
  #joy {
    position: absolute; left: 18px; bottom: 18px; width: 124px; height: 124px;
    border-radius: 50%; background: rgba(23, 16, 46, 0.55);
    border: 2px solid rgba(255, 247, 234, 0.45);
    pointer-events: auto; touch-action: none;
  }
  #joyKnob {
    position: absolute; left: 50%; top: 50%; width: 54px; height: 54px;
    border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
    background: rgba(255, 181, 46, 0.85); border: 2px solid rgba(255, 247, 234, 0.7);
  }
  #joyBtns {
    position: absolute; right: 18px; bottom: 18px;
    display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
  }
  #joyBtns .round-btn {
    pointer-events: auto; touch-action: none; width: 58px; height: 58px;
    border-radius: 50%; border: 2px solid rgba(255, 247, 234, 0.5);
    background: rgba(23, 16, 46, 0.72); color: #fff7ea; cursor: pointer;
    font-family: inherit; font-size: 18px; font-weight: 900;
  }
  #joyBtns #btnRun {
    width: auto; height: 46px; padding: 0 22px; border-radius: 999px;
    background: #ff5f9e; color: #2b0718; font-size: 15px; letter-spacing: 0.1em;
  }
  #joyBtns #btnRadio {
    width: auto; height: 36px; padding: 0 14px; border-radius: 999px;
    font-size: 11px; letter-spacing: 0.1em;
  }
  #dpad {
    position: absolute; right: 14px; bottom: 14px; width: 244px; height: 244px;
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
    grid-template-rows: 1fr 1fr 1fr; pointer-events: auto; touch-action: none;
  }
  #dpad button {
    border-radius: 14px; border: 2px solid rgba(255, 247, 234, 0.45);
    background: rgba(23, 16, 46, 0.66); color: #fff7ea; font-size: 26px;
    font-family: inherit; cursor: pointer; touch-action: none; pointer-events: auto;
  }
  #padUp { grid-column: 2; grid-row: 1; }
  #padLeft { grid-column: 1; grid-row: 2; }
  #padRight { grid-column: 3; grid-row: 2; }
  #padDown { grid-column: 2; grid-row: 3; }
  #btnGas {
    position: absolute; right: 88px; bottom: 268px; width: 72px; height: 72px;
    border-radius: 50%; border: 2px solid #ffe66d; background: #ffb52e;
    color: #241203; font-family: inherit; font-size: 16px; font-weight: 900;
    letter-spacing: 0.08em; cursor: pointer; pointer-events: auto; touch-action: none;
    box-shadow: 0 5px 0 #a96f00, 0 8px 18px rgba(0, 0, 0, 0.5);
  }
  #mapCanvas {
    width: 100%; height: 56vh; border-radius: 12px; background: #0d2440;
    border: 2px solid rgba(255, 247, 234, 0.4);
  }
  #placesList {
    width: min(680px, 94vw); max-height: 22vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 5px;
  }
  .place-row {
    display: flex; justify-content: space-between; gap: 12px; text-align: left;
    padding: 8px 14px; border-radius: 9px; background: rgba(23, 16, 46, 0.9);
    border: 1px solid rgba(255, 247, 234, 0.22); font-size: 14px;
  }
  .place-row .place-area { color: #ffb52e; font-weight: 700; }
  .button-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .button-row .btn { min-width: 0; }
  .quest-columns {
    display: flex; gap: 18px; flex-wrap: wrap; justify-content: center;
    align-items: flex-start; width: min(860px, 96vw);
  }
  .quest-col {
    flex: 1 1 300px; min-width: 260px; text-align: left; padding: 16px;
    background: rgba(23, 16, 46, 0.9); border-radius: 14px;
    border: 1px solid rgba(255, 247, 234, 0.25);
  }
  .quest-col h3 { letter-spacing: 0.14em; color: #ffb52e; margin-bottom: 10px; font-size: 16px; }
  #shopItems { display: flex; flex-direction: column; gap: 9px; width: min(480px, 92vw); }
  #shopItems .btn { width: 100%; min-width: 0; text-align: left; }
  #shopMoney { color: #ffe66d; font-weight: 900; font-size: 18px; }
  #statsBody { display: flex; flex-direction: column; gap: 7px; width: min(460px, 92vw); text-align: left; }
  .stat-row {
    display: flex; justify-content: space-between; padding: 8px 14px;
    border-radius: 9px; background: rgba(23, 16, 46, 0.9); font-size: 15px;
    border: 1px solid rgba(255, 247, 234, 0.2);
  }
  #endingTitle {
    font-size: clamp(36px, 9vw, 72px); font-weight: 900; letter-spacing: 0.12em;
    color: #ffb52e; text-shadow: 0 4px 0 #ff5f9e, 0 8px 22px rgba(0, 0, 0, 0.9);
  }
  #endingMeta { color: #ffb52e; font-size: 14px; letter-spacing: 0.08em; font-weight: 700; }
  .setting-row {
    display: flex; align-items: center; justify-content: space-between; gap: 18px;
    width: min(440px, 92vw); padding: 10px 16px; border-radius: 11px;
    background: rgba(23, 16, 46, 0.9); border: 1px solid rgba(255, 247, 234, 0.22);
    font-size: 15px; font-weight: 700;
  }
  .setting-row select {
    padding: 7px 10px; border-radius: 8px; background: #17102e; color: #fff7ea;
    border: 1px solid rgba(255, 247, 234, 0.4); font-family: inherit; font-size: 14px;
  }
  .setting-row input[type="range"] { width: 150px; accent-color: #ffb52e; }
  .setting-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: #ff5f9e; }
  #scopeOverlay {
    position: absolute; inset: 0; z-index: 30; pointer-events: none;
    background: radial-gradient(circle at center, transparent 0, transparent 34vmin, rgba(0, 0, 0, 0.92) calc(34vmin + 2px), rgba(0, 0, 0, 0.97) 100%);
  }
  #scopeOverlay::before {
    content: ""; position: absolute; left: 50%; top: 0; width: 2px; height: 100%;
    transform: translateX(-50%); background: rgba(255, 60, 60, 0.75);
  }
  #scopeOverlay::after {
    content: ""; position: absolute; top: 50%; left: 0; height: 2px; width: 100%;
    transform: translateY(-50%); background: rgba(255, 60, 60, 0.75);
  }
  #fadeEl {
    position: absolute; inset: 0; z-index: 60; background: #000000;
    opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
  }
  @media (max-width: 640px) {
    #minimap { width: 118px; height: 118px; }
    #starsEl { right: 142px; font-size: 19px; }
    #dpad { width: 208px; height: 208px; }
    #btnGas { bottom: 232px; right: 72px; }
    #objectiveEl { max-width: 38vw; font-size: 11px; }
    .btn { min-width: 200px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud" style="display:none">
    <div class="hud-topleft">
      <div id="moneyEl">$0</div>
      <div class="health-shell"><div id="healthFill"></div></div>
    </div>
    <div id="starsEl"></div>
    <div id="objectiveEl"></div>
    <div id="prisonEl" style="display:none"><span id="prisonText"></span></div>
    <div id="bannerEl" style="display:none"></div>
    <div id="dialogEl" style="display:none">
      <div id="dialogName"></div>
      <div id="dialogText"></div>
      <div id="choiceRow">
        <button id="choiceA" class="btn" type="button"></button>
        <button id="choiceB" class="btn btn-ghost" type="button"></button>
      </div>
    </div>
    <div id="promptEl" style="display:none"></div>
    <div class="minimap-wrap">
      <canvas id="minimap" width="148" height="148"></canvas>
      <div class="minimap-btns">
        <button id="btnZoom" class="btn" type="button">ZOOM · MID</button>
        <button id="btnQuests" class="btn" type="button">QUESTS</button>
        <button id="btnPause" class="btn" type="button">II</button>
      </div>
    </div>
    <div id="radioEl"></div>
    <div id="joy"><div id="joyKnob"></div></div>
    <div id="joyBtns">
      <button id="btnRun" class="round-btn" type="button">RUN</button>
      <button id="btnInteract" class="round-btn" type="button">E</button>
      <button id="btnEnter" class="round-btn" type="button">F</button>
      <button id="btnAttack" class="round-btn" type="button">X</button>
      <button id="btnRadio" class="round-btn" type="button">RADIO</button>
    </div>
    <button id="btnGas" type="button" style="display:none">GAS</button>
    <div id="dpad" style="display:none">
      <button id="padUp" type="button">▲</button>
      <button id="padLeft" type="button">◀</button>
      <button id="padRight" type="button">▶</button>
      <button id="padDown" type="button">▼</button>
    </div>
  </div>

  <div id="menu" class="screen">
    <div class="menu-title">PALM COVE</div>
    <p class="menu-subtitle">A low-poly open-world crime game on a long Florida peninsula at dusk.</p>
    <button id="btnNew" class="btn" type="button">NEW GAME</button>
    <button id="btnLoad" class="btn" type="button">LOAD</button>
    <button id="btnSettings" class="btn btn-ghost" type="button">SETTINGS</button>
    <button id="btnStats" class="btn btn-ghost" type="button">STATS</button>
    <div class="menu-footer">An original game built for the make.fun gta6-01 bounty</div>
  </div>

  <div id="choiceMenu" class="screen" style="display:none">
    <h1>CHOOSE YOUR LEAD</h1>
    <button id="btnVera" class="btn" type="button">VERA SOLANO — the courier. Blonde, pink tank, ice-cold.</button>
    <button id="btnDax" class="btn" type="button">DARIO "DAX" VEGA — her partner. Hawaiian shirt, gold chain, loud.</button>
  </div>

  <div id="pauseMenu" class="screen" style="display:none">
    <h1>PAUSED</h1>
    <button id="btnResume" class="btn" type="button">RESUME</button>
    <button id="btnPauseSettings" class="btn" type="button">SETTINGS</button>
    <button id="btnPauseStats" class="btn" type="button">STATS</button>
    <button id="btnQuitToTitle" class="btn btn-ghost" type="button">QUIT TO TITLE</button>
  </div>

  <div id="settingsMenu" class="screen" style="display:none">
    <h1>SETTINGS</h1>
    <label class="setting-row"><span>Sound</span><input id="setSound" type="checkbox" checked></label>
    <label class="setting-row"><span>Frame rate</span>
      <select id="setFps">
        <option value="30">30</option>
        <option value="60" selected>60</option>
      </select>
    </label>
    <label class="setting-row"><span>Quality</span>
      <select id="setQuality">
        <option value="low">low</option>
        <option value="high" selected>high</option>
      </select>
    </label>
    <label class="setting-row"><span>Brightness</span><input id="setBrightness" type="range" min="0.6" max="1.4" step="0.05" value="1"></label>
    <label class="setting-row"><span>Joystick size</span><input id="setJoystick" type="range" min="0.8" max="1.3" step="0.05" value="1"></label>
    <button id="btnSettingsBack" class="btn" type="button">BACK</button>
  </div>

  <div id="mapOverlay" class="screen" style="display:none">
    <h2>FULL MAP</h2>
    <canvas id="mapCanvas" width="900" height="560"></canvas>
    <div id="placesList"></div>
    <div class="button-row">
      <button id="btnMapIn" class="btn" type="button">+</button>
      <button id="btnMapOut" class="btn" type="button">−</button>
      <button id="btnMapReset" class="btn" type="button">RESET · WHOLE ISLAND</button>
      <button id="btnMapClose" class="btn btn-ghost" type="button">Back</button>
    </div>
  </div>

  <div id="questOverlay" class="screen" style="display:none">
    <h2>QUEST LOG</h2>
    <div class="quest-columns">
      <div id="questMain" class="quest-col"><h3>MAIN QUESTS</h3></div>
      <div id="questSide" class="quest-col"><h3>SIDE JOBS</h3></div>
    </div>
    <button id="btnQuestClose" class="btn" type="button">Back</button>
  </div>

  <div id="shopOverlay" class="screen" style="display:none">
    <h2 id="shopTitle">SHOP</h2>
    <div id="shopMoney">$0</div>
    <div id="shopItems"></div>
    <button id="btnShopClose" class="btn btn-ghost" type="button">Leave</button>
  </div>

  <div id="statsScreen" class="screen" style="display:none">
    <h1>STATS</h1>
    <div id="statsBody"></div>
    <button id="btnStatsBack" class="btn" type="button">BACK</button>
  </div>

  <div id="endingScreen" class="screen" style="display:none">
    <div id="endingTitle"></div>
    <p id="endingText"></p>
    <div id="endingMeta"></div>
    <button id="btnEndingClose" class="btn" type="button">Keep playing</button>
  </div>

  <div id="scopeOverlay" style="display:none"></div>
  <div id="fadeEl"></div>
</div>
<script src="vendor/three.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
